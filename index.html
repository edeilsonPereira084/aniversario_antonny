document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

Fg><\u002Fsvg>\n    <\u002Fdiv>\n    <div class=\"cloud drift slow\" style=\"top:200px;left:8px;width:70px\">\n      <svg viewBox=\"0 0 100 50\" width=\"70\" height=\"35\"><g fill=\"#fff\" stroke=\"#a9cfdc\" stroke-width=\"2\">\n        <circle cx=\"25\" cy=\"30\" r=\"13\"><\u002Fcircle><circle cx=\"48\" cy=\"22\" r=\"17\"><\u002Fcircle><circle cx=\"70\" cy=\"30\" r=\"12\"><\u002Fcircle>\n        <rect x=\"22\" y=\"33\" width=\"50\" height=\"10\" rx=\"5\"><\u002Frect><\u002Fg><\u002Fsvg>\n    <\u002Fdiv>\n    <div class=\"cloud drift fast\" style=\"top:180px;right:32px;width:56px\">\n      <svg viewBox=\"0 0 100 50\" width=\"56\" height=\"28\"><g fill=\"#fff\" stroke=\"#a9cfdc\" stroke-width=\"2\">\n        <circle cx=\"25\" cy=\"30\" r=\"12\"><\u002Fcircle><circle cx=\"48\" cy=\"22\" r=\"16\"><\u002Fcircle><circle cx=\"70\" cy=\"30\" r=\"11\"><\u002Fcircle>\n        <rect x=\"22\" y=\"33\" width=\"50\" height=\"10\" rx=\"5\"><\u002Frect><\u002Fg><\u002Fsvg>\n    <\u002Fdiv>\n    <div class=\"cloud drift\" style=\"top:430px;left:-10px;width:60px\">\n      <svg viewBox=\"0 0 100 50\" width=\"60\" height=\"30\"><g fill=\"#fff\" stroke=\"#a9cfdc\" stroke-width=\"2\">\n        <circle cx=\"25\" cy=\"30\" r=\"12\"><\u002Fcircle><circle cx=\"48\" cy=\"22\" r=\"16\"><\u002Fcircle><circle cx=\"70\" cy=\"30\" r=\"11\"><\u002Fcircle>\n        <rect x=\"22\" y=\"33\" width=\"50\" height=\"10\" rx=\"5\"><\u002Frect><\u002Fg><\u002Fsvg>\n    <\u002Fdiv>\n    <div class=\"cloud drift slow\" style=\"top:520px;right:6px;width:68px\">\n      <svg viewBox=\"0 0 100 50\" width=\"68\" height=\"34\"><g fill=\"#fff\" stroke=\"#a9cfdc\" stroke-width=\"2\">\n        <circle cx=\"25\" cy=\"30\" r=\"13\"><\u002Fcircle><circle cx=\"48\" cy=\"22\" r=\"17\"><\u002Fcircle><circle cx=\"70\" cy=\"30\" r=\"12\"><\u002Fcircle>\n        <rect x=\"22\" y=\"33\" width=\"50\" height=\"10\" rx=\"5\"><\u002Frect><\u002Fg><\u002Fsvg>\n    <\u002Fdiv>\n    <div class=\"cloud drift fast\" style=\"top:680px;left:40px;width:50px\">\n      <svg viewBox=\"0 0 100 50\" width=\"50\" height=\"25\"><g fill=\"#fff\" stroke=\"#a9cfdc\" stroke-width=\"2\">\n        <circle cx=\"25\" cy=\"30\" r=\"12\"><\u002Fcircle><circle cx=\"48\" cy=\"22\" r=\"16\"><\u002Fcircle><circle cx=\"70\" cy=\"30\" r=\"11\"><\u002Fcircle>\n        <rect x=\"22\" y=\"33\" width=\"50\" height=\"10\" rx=\"5\"><\u002Frect><\u002Fg><\u002Fsvg>\n    <\u002Fdiv>\n    <div class=\"cloud drift slow\" style=\"bottom:120px;left:24px;width:54px\">\n      <svg viewBox=\"0 0 100 50\" width=\"54\" height=\"27\"><g fill=\"#fff\" stroke=\"#a9cfdc\" stroke-width=\"2\">\n        <circle cx=\"25\" cy=\"30\" r=\"12\"><\u002Fcircle><circle cx=\"48\" cy=\"22\" r=\"16\"><\u002Fcircle><circle cx=\"70\" cy=\"30\" r=\"11\"><\u002Fcircle>\n        <rect x=\"22\" y=\"33\" width=\"50\" height=\"10\" rx=\"5\"><\u002Frect><\u002Fg><\u002Fsvg>\n    <\u002Fdiv>\n    <div class=\"cloud drift fast\" style=\"bottom:60px;right:30px;width:58px\">\n      <svg viewBox=\"0 0 100 50\" width=\"58\" height=\"29\"><g fill=\"#fff\" stroke=\"#a9cfdc\" stroke-width=\"2\">\n        <circle cx=\"25\" cy=\"30\" r=\"12\"><\u002Fcircle><circle cx=\"48\" cy=\"22\" r=\"16\"><\u002Fcircle><circle cx=\"70\" cy=\"30\" r=\"11\"><\u002Fcircle>\n        <rect x=\"22\" y=\"33\" width=\"50\" height=\"10\" rx=\"5\"><\u002Frect><\u002Fg><\u002Fsvg>\n    <\u002Fdiv>\n\n    <!-- sun -->\n    <div class=\"sun\">\n      <div class=\"sun-rotate\" style=\"position:absolute;inset:0\">\n        <!-- generated rays -->\n        <div id=\"rays\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"core\"><\u002Fdiv>\n      <div class=\"face\">\n        <div class=\"cheek l\"><\u002Fdiv>\n        <div class=\"cheek r\"><\u002Fdiv>\n        <div class=\"eye l\"><\u002Fdiv>\n        <div class=\"eye r\"><\u002Fdiv>\n        <div class=\"mouth\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- arched title -->\n    <svg class=\"arc\" viewBox=\"0 -20 340 220\">\n      <defs>\n        <path id=\"arcPath\" d=\"M 30 150 A 220 220 0 0 1 310 150\" fill=\"none\"><\u002Fpath>\n      <\u002Fdefs>\n      <text>\n        <textPath href=\"#arcPath\" startOffset=\"50%\" text-anchor=\"middle\">primeira volta ao sol<\u002FtextPath>\n      <\u002Ftext>\n    <\u002Fsvg>\n\n    <!-- content -->\n    <div class=\"content\">\n      <p class=\"kicker\">vem celebrar com o<\u002Fp>\n      <div class=\"name\">Antonny<\u002Fdiv>\n      <p class=\"blurb\">Venha comemorar comigo<br>esse dia especial!<\u002Fp>\n\n      <div class=\"date\">\n        <span>27 JUN<\u002Fspan><span class=\"sep\">|<\u002Fspan><span class=\"dow\">SÁB<\u002Fspan><span class=\"sep\">|<\u002Fspan><span class=\"time\">18h00<\u002Fspan>\n      <\u002Fdiv>\n\n      <div class=\"countdown\" id=\"countdown\">\n        <div class=\"cd-cell\"><div class=\"cd-num\" id=\"cd-d\">--<\u002Fdiv><div class=\"cd-lbl\">Dias<\u002Fdiv><\u002Fdiv>\n        <div class=\"cd-cell\"><div class=\"cd-num\" id=\"cd-h\">--<\u002Fdiv><div class=\"cd-lbl\">Horas<\u002Fdiv><\u002Fdiv>\n        <div class=\"cd-cell\"><div class=\"cd-num\" id=\"cd-m\">--<\u002Fdiv><div class=\"cd-lbl\">Min<\u002Fdiv><\u002Fdiv>\n        <div class=\"cd-cell\"><div class=\"cd-num\" id=\"cd-s\">--<\u002Fdiv><div class=\"cd-lbl\">Seg<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"icons\">\n        <button class=\"icon-btn\" data-modal=\"rsvp\">\n          <span class=\"disc\">\n            <svg viewBox=\"0 0 24 24\"><path d=\"M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z\"><\u002Fpath><\u002Fsvg>\n          <\u002Fspan>\n          <span class=\"label\">Confirmar<br>Presença<\u002Fspan>\n        <\u002Fbutton>\n        <button class=\"icon-btn\" data-modal=\"map\">\n          <span class=\"disc\">\n            <svg viewBox=\"0 0 24 24\"><path d=\"M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"3\"><\u002Fcircle><\u002Fsvg>\n          <\u002Fspan>\n          <span class=\"label\">Acessar<br>Localização<\u002Fspan>\n        <\u002Fbutton>\n        <button class=\"icon-btn\" data-modal=\"gifts\">\n          <span class=\"disc\">\n            <svg viewBox=\"0 0 24 24\"><polyline points=\"20 12 20 22 4 22 4 12\"><\u002Fpolyline><rect x=\"2\" y=\"7\" width=\"20\" height=\"5\"><\u002Frect><line x1=\"12\" y1=\"22\" x2=\"12\" y2=\"7\"><\u002Fline><path d=\"M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z\"><\u002Fpath><path d=\"M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z\"><\u002Fpath><\u002Fsvg>\n          <\u002Fspan>\n          <span class=\"label\">Sugestões de<br>Presentes<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fdiv>\n\n      <p class=\"helper\">Toque nos ícones para interagir<\u002Fp>\n      <p class=\"closer\">Esperamos por você!<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- MODAL: RSVP -->\n    <div class=\"modal-backdrop\" id=\"m-rsvp\">\n      <div class=\"modal\">\n        <button class=\"close\" data-close=\"\">✕<\u002Fbutton>\n        <h2>Confirmar presença<\u002Fh2>\n        <p class=\"sub\">Avise pra gente se vai estar lá ☀️<\u002Fp>\n\n        <div id=\"rsvp-form\">\n          <div class=\"field\">\n            <label>Seu nome<\u002Flabel>\n            <input type=\"text\" id=\"rsvp-name\" placeholder=\"Como devemos te chamar?\">\n          <\u002Fdiv>\n          <div class=\"field\">\n            <label>Você vai?<\u002Flabel>\n            <div class=\"seg\" id=\"rsvp-going\">\n              <button data-val=\"yes\" class=\"active\">Sim, estarei lá!<\u002Fbutton>\n              <button data-val=\"no\">Não vou conseguir<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"field\">\n            <label>Quantas pessoas (com você)?<\u002Flabel>\n            <select id=\"rsvp-count\">\n              <option>1<\u002Foption><option>2<\u002Foption><option>3<\u002Foption><option>4<\u002Foption><option>5+<\u002Foption>\n            <\u002Fselect>\n          <\u002Fdiv>\n          <button class=\"primary\" id=\"rsvp-send\">Enviar pelo WhatsApp<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div id=\"rsvp-success\" style=\"display:none\">\n          <div class=\"success\">\n            <div class=\"check\"><svg viewBox=\"0 0 24 24\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg><\u002Fdiv>\n            <h2 style=\"font-size:32px\">Obaaa!<\u002Fh2>\n            <p class=\"sub\" id=\"rsvp-msg\" style=\"margin-bottom:4px\">Sua confirmação foi anotada 🎉<\u002Fp>\n            <button class=\"secondary\" data-close=\"\">Fechar<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- MODAL: Map -->\n    <div class=\"modal-backdrop\" id=\"m-map\">\n      <div class=\"modal\">\n        <button class=\"close\" data-close=\"\">✕<\u002Fbutton>\n        <h2>Onde será<\u002Fh2>\n        <p class=\"sub\">Espaço Shelter — Parnamirim/RN<\u002Fp>\n        <div class=\"map\"><div class=\"pin\"><\u002Fdiv><\u002Fdiv>\n        <div class=\"addr\">\n          <strong>Espaço Shelter<\u002Fstrong>\n          R. Manoel Fernandes, 938<br>\n          Monte Castelo · Parnamirim — RN\n        <\u002Fdiv>\n        <a class=\"secondary\" target=\"_blank\" rel=\"noopener noreferrer\" id=\"link-maps\" href=\"https://www.google.com/maps/search/?api=1&amp;query=Espa%C3%A7o+Shelter+Rua+Manoel+Fernandes+938+Monte+Castelo+Parnamirim\">\n          <svg viewBox=\"0 0 24 24\"><path d=\"M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"3\"><\u002Fcircle><\u002Fsvg>\n          Abrir no Google Maps\n        <\u002Fa>\n        <a class=\"secondary\" target=\"_blank\" rel=\"noopener noreferrer\" id=\"link-waze\" href=\"https://waze.com/ul?q=Espa%C3%A7o%20Shelter%20Rua%20Manoel%20Fernandes%20938%20Parnamirim\">\n          <svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M8 11h.01\"><\u002Fpath><path d=\"M16 11h.01\"><\u002Fpath><path d=\"M8 15s1.5 2 4 2 4-2 4-2\"><\u002Fpath><\u002Fsvg>\n          Abrir no Waze\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- MODAL: Gifts -->\n    <div class=\"modal-backdrop\" id=\"m-gifts\">\n      <div class=\"modal\">\n        <button class=\"close\" data-close=\"\">✕<\u002Fbutton>\n        <h2>Sugestões de presentes<\u002Fh2>\n        <p class=\"sub\">Qualquer mimo é bem-vindo — abaixo algumas ideias 💛<\u002Fp>\n\n        <div class=\"gift\">\n          <div class=\"ico\"><svg viewBox=\"0 0 24 24\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\"><\u002Frect><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\"><\u002Frect><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\"><\u002Frect><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\"><\u002Frect><\u002Fsvg><\u002Fdiv>\n          <div><p class=\"ttl\">Brinquedos educativos<\u002Fp><p class=\"desc\">De montar ou empilhar — desenvolve coordenação e criatividade.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"gift\">\n          <div class=\"ico\"><svg viewBox=\"0 0 24 24\"><path d=\"M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4z\"><\u002Fpath><path d=\"M4 4v12a4 4 0 0 0 4 4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <div><p class=\"ttl\">Livros infantis<\u002Fp><p class=\"desc\">Histórias ilustradas, livros sensoriais ou de pano.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"gift\">\n          <div class=\"ico\"><svg viewBox=\"0 0 24 24\"><path d=\"M8 2h8v4l2 3v9a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V9l2-3z\"><\u002Fpath><path d=\"M10 14h4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <div><p class=\"ttl\">Perfumes infantis<\u002Fp><p class=\"desc\">Linhas suaves, hipoalergênicas para a idade.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"gift\">\n          <div class=\"ico\"><svg viewBox=\"0 0 24 24\"><path d=\"M6 4h12l-1 8H7z\"><\u002Fpath><path d=\"M7 12l-2 8h14l-2-8\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <div><p class=\"ttl\">Roupinhas<\u002Fp><p class=\"desc\">Tamanho <strong>2 anos<\u002Fstrong>.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"gift\">\n          <div class=\"ico\"><svg viewBox=\"0 0 24 24\"><path d=\"M3 14c2-1 4-1 6 0s4 1 6 0 4-1 6 0v4H3z\"><\u002Fpath><path d=\"M5 14V8a3 3 0 0 1 3-3h2\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <div><p class=\"ttl\">Calçadinhos<\u002Fp><p class=\"desc\">Tamanho <strong>22 / 23<\u002Fstrong>.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n\n        <button class=\"secondary\" data-close=\"\" style=\"margin-top:14px\">Fechar<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n  // generate sun rays — reusable for main + corner suns\n  function makeRays(wrap, cfg){\n    const N = cfg.N || 16;\n    const innerR = cfg.innerR;\n    for(let i=0;i<N;i++){\n      const a = (360/N)*i;\n      const isShort = i%2 === 1;\n      const w = isShort ? cfg.shortW : cfg.longW;\n      const h = isShort ? cfg.shortH : cfg.longH;\n\n      const spoke = document.createElement('div');\n      spoke.style.position = 'absolute';\n      spoke.style.left = '50%';\n      spoke.style.top = '50%';\n      spoke.style.width = '0';\n      spoke.style.height = '0';\n      spoke.style.transform = `rotate(${a}deg)`;\n\n      const ray = document.createElement('div');\n      ray.className = 'ray' + (isShort ? ' short' : '');\n      ray.style.position = 'absolute';\n      ray.style.width = w + 'px';\n      ray.style.height = h + 'px';\n      ray.style.left = `-${w/2}px`;\n      ray.style.top = `-${h + innerR}px`;\n      ray.style.borderRadius = '50% 50% 50% 50% / 70% 70% 30% 30%';\n      ray.style.background = isShort\n        ? 'linear-gradient(180deg,#ffc380,#f3a44a)'\n        : 'linear-gradient(180deg,#ffb764,#e88a2d)';\n      ray.style.opacity = isShort ? '.85' : '1';\n\n      spoke.appendChild(ray);\n      wrap.appendChild(spoke);\n    }\n  }\n\n  // main sun: rays sized for 280px sun\n  makeRays(document.getElementById('rays'), {\n    N: 16, innerR: 76,\n    longW: 20, longH: 62,\n    shortW: 13, shortH: 38,\n  });\n  // corner suns: 200px each\n  makeRays(document.getElementById('rays-tl'), {\n    N: 16, innerR: 46,\n    longW: 14, longH: 46,\n    shortW: 9, shortH: 28,\n  });\n  makeRays(document.getElementById('rays-br'), {\n    N: 16, innerR: 46,\n    longW: 14, longH: 46,\n    shortW: 9, shortH: 28,\n  });\n\n  /* scaling */\n  function fit(){\n    const vv = window.visualViewport;\n    const w = vv ? vv.width  : window.innerWidth;\n    const h = vv ? vv.height : window.innerHeight;\n    const isPhone = (h / w) > 1.2; // tall viewport = phone-like\n    let scale;\n    if (isPhone) {\n      // Fill the screen edge-to-edge (cover) on phones\n      scale = Math.max(w/420, h/900);\n    } else {\n      // Desktop / landscape: contain with small margin, keep card chrome\n      scale = Math.min(w/420, h/900) * 0.95;\n    }\n    const el = document.getElementById('invite-wrap');\n    el.style.transform = `translate(-50%,-50%) scale(${scale})`;\n    if (isPhone || scale <= 1.02) {\n      el.style.borderRadius = '0';\n      el.style.boxShadow = 'none';\n    } else {\n      el.style.borderRadius = '32px';\n      el.style.boxShadow = '0 30px 80px rgba(0,0,0,.25), 0 0 0 1px rgba(0,0,0,.04)';\n    }\n  }\n  fit();\n  window.addEventListener('resize', fit);\n  window.addEventListener('orientationchange', fit);\n  if (window.visualViewport){\n    window.visualViewport.addEventListener('resize', fit);\n    window.visualViewport.addEventListener('scroll', fit);\n  }\n  // re-fit a few times after load to catch mobile address-bar collapse\n  [150, 500, 1200].forEach(t => setTimeout(fit, t));\n\n  // Open external URL safely — uses a programmatic anchor click which\n  // survives iframe sandboxes and popup blockers since it counts as a\n  // user-initiated link click. Single action, no duplicates.\n  function openExt(url){\n    const a = document.createElement('a');\n    a.href = url;\n    a.target = '_blank';\n    a.rel = 'noopener noreferrer';\n    document.body.appendChild(a);\n    a.click();\n    setTimeout(() => a.remove(), 100);\n  }\n\n  // countdown to 2026-06-27 18:00 (local)\n  function tick(){\n    const target = new Date(2026, 5, 27, 18, 0, 0).getTime();\n    const now = Date.now();\n    let diff = Math.max(0, target - now);\n    const d = Math.floor(diff/86400000); diff -= d*86400000;\n    const h = Math.floor(diff/3600000); diff -= h*3600000;\n    const m = Math.floor(diff/60000); diff -= m*60000;\n    const s = Math.floor(diff/1000);\n    document.getElementById('cd-d').textContent = String(d).padStart(2,'0');\n    document.getElementById('cd-h').textContent = String(h).padStart(2,'0');\n    document.getElementById('cd-m').textContent = String(m).padStart(2,'0');\n    document.getElementById('cd-s').textContent = String(s).padStart(2,'0');\n  }\n  tick(); setInterval(tick, 1000);\n\n  // modal logic\n  function openModal(id){\n    document.getElementById(id).classList.add('open');\n  }\n  function closeAll(){\n    document.querySelectorAll('.modal-backdrop').forEach(m=>m.classList.remove('open'));\n    // reset rsvp form view on close\n    document.getElementById('rsvp-form').style.display = '';\n    document.getElementById('rsvp-success').style.display = 'none';\n  }\n  document.querySelectorAll('[data-modal]').forEach(b=>{\n    b.addEventListener('click', ()=> openModal('m-'+b.dataset.modal));\n  });\n  document.querySelectorAll('[data-close]').forEach(b=>{\n    b.addEventListener('click', closeAll);\n  });\n  document.querySelectorAll('.modal-backdrop').forEach(bd=>{\n    bd.addEventListener('click', e=>{ if(e.target===bd) closeAll(); });\n  });\n\n  // rsvp segmented\n  let going = 'yes';\n  document.querySelectorAll('#rsvp-going button').forEach(b=>{\n    b.addEventListener('click', ()=>{\n      document.querySelectorAll('#rsvp-going button').forEach(x=>x.classList.remove('active'));\n      b.classList.add('active');\n      going = b.dataset.val;\n    });\n  });\n\n  document.getElementById('rsvp-send').addEventListener('click', ()=>{\n    const name = (document.getElementById('rsvp-name').value || '').trim();\n    const count = document.getElementById('rsvp-count').value;\n    if(!name){\n      document.getElementById('rsvp-name').focus();\n      document.getElementById('rsvp-name').style.borderColor = 'var(--sun)';\n      return;\n    }\n    const msg = going==='yes'\n      ? 'Olá! Sou ' + name + ' e vou na festinha de aniversário do Antonny — vamos em ' + count + '.'\n      : 'Olá! Sou ' + name + ' e infelizmente não vou poder ir na festinha do Antonny. Mando muito carinho.';\n    const wa = 'https://wa.me/5584992320938?text=' + encodeURIComponent(msg);\n    // show success state in-modal\n    document.getElementById('rsvp-form').style.display = 'none';\n    const ok = document.getElementById('rsvp-success');\n    ok.style.display = 'block';\n    document.getElementById('rsvp-msg').textContent = going==='yes'\n      ? 'Recebemos sua confirmação, ' + name + '! Mal podemos esperar.'\n      : 'Sentiremos sua falta, ' + name + '. Obrigado por avisar.';\n    // open WhatsApp via single, sandboxed-safe link click\n    openExt(wa);\n  });\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
